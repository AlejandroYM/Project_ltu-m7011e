
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}

---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-ca
  namespace: chefmatch
spec:
  isCA: true
  commonName: chefmatch-internal-ca
  secretName: internal-ca-secret          
  duration: 87600h                        
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io


apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: internal-ca-issuer
  namespace: chefmatch
spec:
  ca:
    secretName: internal-ca-secret

---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rabbitmq-tls
  namespace: chefmatch
spec:
  secretName: rabbitmq-tls-secret
  duration: 8760h                         
  renewBefore: 720h                       
  commonName: rabbitmq-service
  dnsNames:
    - rabbitmq-service
    - rabbitmq-service.chefmatch.svc.cluster.local
  issuerRef:
    name: internal-ca-issuer
    kind: Issuer

---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mongodb-tls
  namespace: chefmatch
spec:
  secretName: mongodb-tls-secret
  duration: 8760h
  renewBefore: 720h
  commonName: mongo-service
  dnsNames:
    - mongo-service
    - mongo-service.chefmatch.svc.cluster.local
  issuerRef:
    name: internal-ca-issuer
    kind: Issuer
